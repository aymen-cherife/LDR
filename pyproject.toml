[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldr"
version = "0.6.0"
description = "Execution tracing and behavioural diffing for Python, with zero source instrumentation."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "rich==15.0.0"]
pytest = ["pytest>=7", "rich==15.0.0"]

[project.scripts]
ldr = "ldr.launch:main"

[tool.setuptools.packages.find]
include = ["ldr*"]
