[package]
name = "ldr-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.5", features = ["extension-module"] }
blake2 = "0.10.6"
fancy-regex = "0.14"
regex = "1"
rustc-hash = "2"

[build-dependencies]
pyo3-build-config = "0.23.5"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
