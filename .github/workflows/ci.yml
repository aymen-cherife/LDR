name: Core tests

on:
  push:
    branches: [main, phase-2]
  pull_request:

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LDR and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run the full suite
        run: python -m pytest -q
